<!--
  Production-Ready Reaction Component for a Static Blog using Firebase
  - This version is now styled by the external '_reactions.scss' file.
-->
<div id="reaction-component-container">
    <h3>What did you think of this post?</h3>
    <div id="reactions" class="reaction-buttons">
        <div class="reaction-button" data-reaction="thumbsUp">
            <span>👍</span>
            <span class="reaction-count" data-count="thumbsUp">0</span>
        </div>
        <div class="reaction-button" data-reaction="heart">
            <span>❤️</span>
            <span class="reaction-count" data-count="heart">0</span>
        </div>
        <div class="reaction-button" data-reaction="party">
            <span>🎉</span>
            <span class="reaction-count" data-count="party">0</span>
        </div>
        <div class="reaction-button" data-reaction="thinking">
            <span>🤔</span>
            <span class="reaction-count" data-count="thinking">0</span>
        </div>
    </div>
    <p id="reaction-message"></p>
</div>

<!-- Firebase Integration (JavaScript logic remains the same) -->
<script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
    	apiKey: "AIzaSyAErggYsoIb39kNUDAHUhUguBTRCvMxcss",
	authDomain: "hatcher-blog-reactions.firebaseapp.com",
	projectId: "hatcher-blog-reactions",
	storageBucket: "hatcher-blog-reactions.firebasestorage.app",
	messagingSenderId: "781205290896",
	appId: "1:781205290896:web:dfbdfa69d2e2955ae07d15"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const postSlug = window.location.pathname.replace(/\//g, '_').replace(/[^a-zA-Z0-9_-]/g, '');
    const reactionsRef = doc(db, "reactions", postSlug);
    const reactedKey = `reacted_${postSlug}`;

    const updateCounts = (data) => {
        document.querySelectorAll("[data-count]").forEach(span => {
            const reactionType = span.dataset.count;
            span.textContent = data[reactionType] || 0;
        });
    };

    onSnapshot(reactionsRef, (docSnap) => {
        if (docSnap.exists()) {
            updateCounts(docSnap.data());
        } else {
            updateCounts({ thumbsUp: 0, heart: 0, party: 0, thinking: 0 });
        }
    });

    document.querySelectorAll('.reaction-button').forEach(button => {
        button.addEventListener('click', async () => {
            const reactionType = button.dataset.reaction;
            const givenReactions = JSON.parse(localStorage.getItem(reactedKey) || '{}');

            if (givenReactions[reactionType]) {
                const reactionMessage = document.getElementById('reaction-message');
                reactionMessage.textContent = 'You have already given this reaction!';
                reactionMessage.classList.add('visible');
                setTimeout(() => {
                    reactionMessage.classList.remove('visible');
                }, 3000);
                return;
            }

            try {
                const docSnap = await getDoc(reactionsRef);
                const currentData = docSnap.exists() ? docSnap.data() : { thumbsUp: 0, heart: 0, party: 0, thinking: 0 };
                
                const newData = {
                    ...currentData,
                    [reactionType]: (currentData[reactionType] || 0) + 1
                };

                await setDoc(reactionsRef, newData);

                givenReactions[reactionType] = true;
                localStorage.setItem(reactedKey, JSON.stringify(givenReactions));
                highlightReactedButtons();
                
            } catch (error) {
                console.error("Error updating reaction: ", error);
            }
        });
    });

    const highlightReactedButtons = () => {
         const givenReactions = JSON.parse(localStorage.getItem(reactedKey) || '{}');
         document.querySelectorAll('.reaction-button').forEach(button => {
             const reactionType = button.dataset.reaction;
             if (givenReactions[reactionType]) {
                button.classList.add('already-reacted');
             }
         });
    };
   
    onAuthStateChanged(auth, (user) => {
        if (user) {
		            console.log("Firebase Auth: Anonymous user signed in with UID:", user.uid);
	} else {
		            console.log("Firebase Auth: No user detected. Attempting anonymous sign-in...");
signInAnonymously(auth).catch((error) => {
                console.error("Anonymous sign-in failed:", error);
            });
	    }
    });

    highlightReactedButtons();

</script>
